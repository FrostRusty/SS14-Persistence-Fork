
# Persistence foods in bowls

- type: entity
  name: macaroni and cheese
  parent: FoodBowlBase
  id: FoodMacaroniCheese
  description: A bowl of macaroni and cheese.
  components:
  - type: FlavorProfile
    flavors:
      - pasta
      - cheesy
  - type: Sprite
    sprite: _Persistence14/Objects/Consumable/Food/bowl.rsi
    layers:
    - state: bowl
    - state: macaroni-cheese
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 25
